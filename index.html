<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Remote Display Jadwal Sholat</title>
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <style>
    :root {
      --accent-color: #f59e0b;
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --text-light: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-light); padding: 15px; max-width: 600px; margin: 0 auto; min-height: 100vh; padding-bottom: 40px; }

    header { text-align: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px solid var(--border-color); }
    header h1 { font-size: 1.4rem; color: var(--accent-color); margin-bottom: 4px; }
    header p { font-size: 0.85rem; color: var(--text-muted); }

    .status-bar { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 0.8rem; margin-top: 8px; padding: 6px 12px; background: rgba(255,255,255,0.05); border-radius: 20px; width: fit-content; margin-left: auto; margin-right: auto; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #ef4444; transition: background 0.3s; }
    .status-dot.online { background: #10b981; box-shadow: 0 0 8px #10b981; }
    .status-dot.saving { background: #f59e0b; box-shadow: 0 0 8px #f59e0b; }

    /* MODE SWITCHER CONTROL */
    .mode-card { background: var(--card-bg); border: 2px solid var(--accent-color); border-radius: 12px; padding: 15px; margin-bottom: 20px; text-align: center; }
    .mode-card h3 { font-size: 1rem; color: var(--accent-color); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
    .mode-nav { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .btn-nav-mode { background: #334155; border: 1px solid var(--border-color); color: #fff; width: 44px; height: 44px; border-radius: 10px; font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
    .btn-nav-mode:active { background: var(--accent-color); color: #000; transform: scale(0.95); }
    .mode-display-box { flex: 1; background: #0f172a; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); }
    .mode-title { font-weight: 800; font-size: 1.1rem; color: #fff; }
    .mode-desc { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }

    /* FORM GROUPS */
    .section-title { font-size: 0.95rem; font-weight: 700; color: var(--accent-color); margin: 20px 0 10px 0; border-left: 3px solid var(--accent-color); padding-left: 8px; }
    .form-group { margin-bottom: 14px; background: var(--card-bg); padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border-color); }
    label { display: block; font-size: 0.85rem; font-weight: 600; color: #cbd5e1; margin-bottom: 6px; }
    input, select, textarea { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background: #0f172a; color: #fff; font-size: 0.9rem; outline: none; transition: border 0.2s; }
    input:focus, select:focus, textarea:focus { border-color: var(--accent-color); }

    .city-search-container { position: relative; }
    .city-suggestions { position: absolute; top: 100%; left: 0; right: 0; max-height: 180px; overflow-y: auto; background: #1e293b; border: 1px solid var(--accent-color); border-radius: 0 0 8px 8px; z-index: 100; display: none; box-shadow: 0 8px 20px rgba(0,0,0,0.8); }
    .city-suggestions.show { display: block; }
    .city-suggestion-item { padding: 10px 12px; font-size: 0.85rem; color: #cbd5e1; cursor: pointer; border-bottom: 1px solid var(--border-color); }
    .city-suggestion-item:hover { background: var(--accent-color); color: #000; font-weight: bold; }
  </style>
</head>
<body>

  <header>
    <h1>📱 Remote Admin Display</h1>
    <p>Perubahan langsung tersimpan otomatis secara realtime</p>
    <div class="status-bar">
      <div class="status-dot" id="status-dot"></div>
      <span id="status-text">Menghubungkan...</span>
    </div>
  </header>

  <!-- CONTROL MODE DISPLAY (KANAN & KIRI) -->
  <div class="mode-card">
    <h3>Mode Tampilan Display</h3>
    <div class="mode-nav">
      <button class="btn-nav-mode" id="btn-prev-mode" title="Mode Sebelumnya">&#9664;</button>
      <div class="mode-display-box">
        <div class="mode-title" id="current-mode-name">Mode Utama</div>
        <div class="mode-desc" id="current-mode-desc">Tampilan standar jam & banner</div>
      </div>
      <button class="btn-nav-mode" id="btn-next-mode" title="Mode Selanjutnya">&#9654;</button>
    </div>
  </div>

  <form id="admin-form" onsubmit="event.preventDefault();">

    <div class="section-title">Informasi Masjid</div>
    <div class="form-group">
      <label for="input-masjid">Nama Masjid</label>
      <input type="text" id="input-masjid" placeholder="Masjid Al Jihad" data-field="masjid">
    </div>

    <div class="form-group">
      <label for="input-alamat">Alamat Masjid</label>
      <textarea id="input-alamat" rows="2" placeholder="Alamat lengkap..." data-field="alamat"></textarea>
    </div>

    <div class="form-group">
      <label for="input-search-kota">Lokasi Kota / Kab (KEMENAG)</label>
      <div class="city-search-container">
        <input type="text" id="input-search-kota" placeholder="Ketik nama kota... (mis: Jambi)" autocomplete="off">
        <input type="hidden" id="select-kota-id">
        <div class="city-suggestions" id="city-suggestions"></div>
      </div>
    </div>

    <div class="section-title">Pengaturan Waktu & Tema</div>
    <div class="form-group">
      <label for="input-iqomah-timer">Durasi Jeda Iqomah (Menit)</label>
      <input type="number" id="input-iqomah-timer" min="1" max="30" placeholder="10" data-field="iqomahTimer">
    </div>

    <div class="form-group">
      <label for="input-theme">Tema Warna Tampilan</label>
      <select id="input-theme" data-field="theme">
        <option value="amber">Amber Gold (Default)</option>
        <option value="emerald">Emerald Green</option>
        <option value="ocean">Ocean Blue</option>
        <option value="crimson">Crimson Red</option>
        <option value="purple">Royal Purple</option>
      </select>
    </div>

    <div class="section-title">Media & Banner</div>
    <div class="form-group">
      <label for="input-main-banner">URL Gambar Utama / Banner Single</label>
      <input type="text" id="input-main-banner" placeholder="URL Gambar / Kosongkan untuk Default" data-field="mainBanner">
    </div>

    <div class="form-group">
      <label for="input-slide-timer">Durasi Per Slide Banner (Detik)</label>
      <input type="number" id="input-slide-timer" min="2" max="60" placeholder="5" data-field="slideTimer">
    </div>

    <div class="form-group">
      <label for="input-slideshow-urls">Link Slideshow (Mode Sidebar & Fullscreen)</label>
      <textarea id="input-slideshow-urls" rows="3" placeholder="Masukkan URL gambar/video, pisahkan dengan baris baru (Enter)" data-field="slidesText"></textarea>
    </div>

    <div class="form-group">
      <label for="input-youtube-url">URL Stream YouTube (Mode Video)</label>
      <input type="text" id="input-youtube-url" placeholder="https://www.youtube.com/watch?v=..." data-field="youtubeUrl">
    </div>

    <div class="section-title">Teks Berjalan (Running Text)</div>
    <div class="form-group">
      <label for="input-running-text">Informasi Running Text</label>
      <textarea id="input-running-text" rows="3" placeholder="Pesan informasi berjalan..." data-field="runningText"></textarea>
    </div>

  </form>

  <script>
    // Konfigurasi Firebase Anda
    const firebaseConfig = {
      apiKey: "AIzaSyAowFtl3jYyW9oApK8InVRDY-eXUthagbU",
      authDomain: "jadwalsholatapp.firebaseapp.com",
      databaseURL: "https://jadwalsholatapp-default-rtdb.firebaseio.com",
      projectId: "jadwalsholatapp",
      storageBucket: "jadwalsholatapp.firebasestorage.app",
      messagingSenderId: "232235581161",
      appId: "1:232235581161:web:85456e16ffa552f4887a78"
    };

    firebase.initializeApp(firebaseConfig);
    const dbRef = firebase.database().ref('settings');

    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');

    // Status Koneksi Firebase
    firebase.database().ref('.info/connected').on('value', (snap) => {
      if (snap.val() === true) {
        statusDot.className = 'status-dot online';
        statusText.textContent = 'Terhubung & Sinkron Realtime';
      } else {
        statusDot.className = 'status-dot';
        statusText.textContent = 'Terputus dari Server';
      }
    });

    let isRemoteUpdating = false;

    // Fungsi Kirim Data Otomatis (Realtime Auto-Save)
    function autoSave(field, value) {
      if (isRemoteUpdating) return;
      statusDot.className = 'status-dot saving';
      statusText.textContent = 'Menyimpan perubahan...';

      dbRef.child(field).set(value, (err) => {
        if (!err) {
          statusDot.className = 'status-dot online';
          statusText.textContent = 'Tersimpan Otomatis';
        }
      });
    }

    // Pasang Event Listener Auto-Save ke Setiap Input
    const inputs = document.querySelectorAll('input[data-field], textarea[data-field], select[data-field]');
    inputs.forEach(input => {
      const field = input.getAttribute('data-field');
      
      // Menggunakan 'input' untuk teks agar langsung terkirim saat diketik
      input.addEventListener('input', () => {
        autoSave(field, input.value);
      });
    });

    // Pengaturan Mode Display (Kanan & Kiri)
    const modesList = [
      { id: 'mode-main', name: 'Mode Utama', desc: 'Tampilan standar jam, banner, & footer jadwal' },
      { id: 'mode-video', name: 'Mode Video Streaming', desc: 'Layar penuh video YouTube & popup jam' },
      { id: 'mode-fullscreen', name: 'Mode Fullscreen Slide', desc: 'Slide gambar penuh layar & popup footer' },
      { id: 'mode-sidebar', name: 'Mode Sidebar Schedule', desc: 'Jadwal sholat berdiri di sisi kiri & slide gambar' }
    ];
    let currentModeIdx = 0;

    function updateModeDisplay() {
      const mode = modesList[currentModeIdx];
      document.getElementById('current-mode-name').textContent = mode.name;
      document.getElementById('current-mode-desc').textContent = mode.desc;
    }

    document.getElementById('btn-prev-mode').addEventListener('click', () => {
      currentModeIdx = (currentModeIdx - 1 + modesList.length) % modesList.length;
      updateModeDisplay();
      autoSave('activeModeIdx', currentModeIdx);
    });

    document.getElementById('btn-next-mode').addEventListener('click', () => {
      currentModeIdx = (currentModeIdx + 1) % modesList.length;
      updateModeDisplay();
      autoSave('activeModeIdx', currentModeIdx);
    });

    // Ambil Data Awal dan Sinkronisasi Masuk dari Firebase
    dbRef.on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        isRemoteUpdating = true;
        inputs.forEach(input => {
          const field = input.getAttribute('data-field');
          if (data[field] !== undefined && document.activeElement !== input) {
            input.value = data[field];
          }
        });

        if (data.cityName !== undefined && document.activeElement !== searchInput) {
          searchInput.value = data.cityName;
        }
        if (data.cityId !== undefined) {
          cityIdInput.value = data.cityId;
        }

        if (data.activeModeIdx !== undefined) {
          currentModeIdx = parseInt(data.activeModeIdx) || 0;
          updateModeDisplay();
        }
        isRemoteUpdating = false;
      }
    });

    // Fitur Pencarian Kota Kemenag (MyQuran API)
    let allCities = [];
    const searchInput = document.getElementById('input-search-kota');
    const cityIdInput = document.getElementById('select-kota-id');
    const suggestionsBox = document.getElementById('city-suggestions');

    async function fetchCities() {
      try {
        const response = await fetch('https://api.myquran.com/v2/sholat/kota/semua');
        const data = await response.json();
        if (data.status) allCities = data.data;
      } catch (err) {
        console.error('Gagal mengambil daftar kota:', err);
      }
    }
    fetchCities();

    searchInput.addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase().trim();
      suggestionsBox.innerHTML = '';
      if (!query) { suggestionsBox.classList.remove('show'); return; }

      const filtered = allCities.filter(c => c.lokasi.toLowerCase().includes(query));
      if (filtered.length > 0) {
        filtered.slice(0, 6).forEach((c) => {
          const item = document.createElement('div');
          item.className = 'city-suggestion-item';
          item.textContent = c.lokasi;
          item.addEventListener('click', () => {
            searchInput.value = c.lokasi;
            cityIdInput.value = c.id;
            suggestionsBox.classList.remove('show');
            // Simpan kota otomatis ke Firebase
            autoSave('cityName', c.lokasi);
            autoSave('cityId', c.id);
          });
          suggestionsBox.appendChild(item);
        });
        suggestionsBox.classList.add('show');
      } else {
        suggestionsBox.classList.remove('show');
      }
    });

    document.addEventListener('click', (e) => {
      if (!searchInput.contains(e.target)) suggestionsBox.classList.remove('show');
    });
  </script>
</body>
</html>
